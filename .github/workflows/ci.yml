name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check README documentation
        run: test -f README.md

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build binary
        run: go build -o apv .

      - name: Self-test validation on test fixtures
        run: |
          ./apv validate testdata/valid_minimal.json
          ./apv validate testdata/valid_full.json
          ./apv validate --format json testdata/valid_minimal.json
          ! ./apv validate -q testdata/invalid_name_uppercase.json
